# 依赖版本集中管理。新增依赖请在这里登记，不要在模块里写死版本号。
#
# 版本选择约束（改动前请先读）：
#   AGP 8.13.2 最高支持 compileSdk 36。
#   AndroidX 里凡是标注 minCompileSdk=37 / minAgpVersion=9.1.0 的构件都不能用，
#   会在 :app:checkDebugAarMetadata 阶段直接失败。
#   因此这里刻意停在"AGP 8.x 可用的最新版本"上：
#     - material3   1.5.0-alpha18  （alpha19 起要求 compileSdk 37）
#     - compose ui  1.11.4         （1.12.0 起要求 compileSdk 37）
#     - lifecycle   2.10.0         （2.11.0 起要求 compileSdk 37）
#     - core-ktx    1.17.0         （1.19.0 起要求 compileSdk 37）
#   等 AGP 9.x 稳定后可整体上抬。
[versions]
agp = "8.13.2"
kotlin = "2.2.21"

# Material 3 Expressive 只在 material3 1.5.0-alphaXX 提供，不走 compose-bom。
material3Expressive = "1.5.0-alpha18"
# compose ui / foundation / animation 统一版本（不用 BOM，避免 BOM 把 ui 抬到 1.12.0）
composeUi = "1.11.4"
materialIcons = "1.7.8"

coreKtx = "1.17.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
navigationCompose = "2.9.8"
graphicsShapes = "1.1.0"

# 播放内核
media3 = "1.11.0"
jaudiotagger = "3.0.1"
documentfile = "1.0.1"
# 本地落库与设置持久化
room = "2.7.2"
datastore = "1.2.1"
# 自定义音源 JS 引擎（LX-Pro-Music 同款，含 arm64/armv7/x86/x86_64 .so）
quickjs = "3.2.3"
# 封面图片加载
coil = "2.7.0"
# Haze 硬件加速模糊（顶栏/控制台毛玻璃，Expr 实验分支）
haze = "2.0.0-beta01"
# KugouKrcMetadataDecoder 需要（accompanist 歌词 core 源码依赖）
kotlinxSerializationJson = "1.7.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeUi" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "composeUi" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composeUi" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "composeUi" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "composeUi" }
# SharedTransitionLayout / sharedElement 在这个模块里
androidx-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "composeUi" }

# M3 Expressive：MaterialExpressiveTheme / MotionScheme / LoadingIndicator /
# WavyProgressIndicator / MaterialShapes / ButtonGroup / FloatingToolbar 等
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3Expressive" }
androidx-material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "material3Expressive" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }
# MaterialShapes 依赖的多边形形状库
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphicsShapes" }

# Media3 播放内核：ExoPlayer 解码 + MediaSession 通知栏/外部控制
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
net-jaudiotagger = { group = "net.jthink", name = "jaudiotagger", version.ref = "jaudiotagger" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }

# Room：曲库 / 歌单 / 播放记录落库
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# DataStore：设置持久化
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# QuickJS：执行用户自定义音源脚本
quickjs-wrapper = { group = "wang.harlon.quickjs", name = "wrapper-android", version.ref = "quickjs" }

# Coil：专辑封面加载
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
# Haze：Compose 硬件加速模糊（事实标准库）
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
haze-blur = { group = "dev.chrisbanes.haze", name = "haze-blur", version.ref = "haze" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Room 注解处理
ksp = { id = "com.google.devtools.ksp", version = "2.2.21-2.0.4" }