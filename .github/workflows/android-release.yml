name: Android Release

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

# 需要写权限才能创建 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Resolve version and tag
        id: meta
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/music-player-${{ steps.meta.outputs.version }}-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: music-player-release
          path: dist/*.apk

      # 构建完成后直接发布到 Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: music-player ${{ steps.meta.outputs.version }} (${{ github.ref_name }})
          body: |
            分支：`${{ github.ref_name }}`
            提交：`${{ github.sha }}`

            本包由 GitHub Actions 自动构建，使用 debug 签名（未配置发布密钥）。
          prerelease: ${{ github.ref_name != 'main' }}
          files: dist/*.apk